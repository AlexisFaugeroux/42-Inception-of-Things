---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app1-html
              mountPath: /usr/share/nginx/html
            - name: app1-nginx
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: app1-html
          configMap:
            name: app1-html
            items:
              - key: index.html
                path: index.html
        - name: app1-nginx
          configMap:
            name: app1-nginx
            items:
              - key: default.conf
                path: default.conf
