---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-deployment
  labels:
    app: app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app3-html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: app3-nginx
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: app3-html
          configMap:
            name: app3-html
        - name: app3-nginx
          configMap:
            name: app3-nginx
            items:
              - key: default.conf
                path: default.conf
