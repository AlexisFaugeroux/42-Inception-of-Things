---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
  labels:
    app: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app2-html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: app2-nginx
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: app2-html
          configMap:
            name: app2-html
        - name: app2-nginx
          configMap:
            name: app2-nginx
            items:
              - key: default.conf
                path: default.conf
