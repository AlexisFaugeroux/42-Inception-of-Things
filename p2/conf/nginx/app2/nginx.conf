server {
	listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
		try_files $uri $uri/ =404;
		# Server Side Includes: replaces <!--# echo var="..." --> in the HTML (e.g. pod name)
		ssi on;
		# Never cache, so each refresh is a new request that may hit another replica
		add_header Cache-Control "no-store";
    }
}
 
