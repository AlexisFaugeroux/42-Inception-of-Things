server {
	listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
		try_files $uri $uri/ =404;
		# Server Side Includes: replaces <!--# echo var="..." --> in the HTML (e.g. requested host)
		ssi on;
		# The page depends on the Host header, so it must not be cached
		add_header Cache-Control "no-store";
    }
}
 
