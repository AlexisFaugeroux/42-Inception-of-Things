<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App 3 · Page par défaut</title>
<style>
	:root {
		--bg: #f7f6f3; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #5a5a60; --border: #d9d7d0;
		--accent: #1b7f7f; --accent-bg: #e5f4f3;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #141416; --surface: #1e1e22; --ink: #ececef; --ink-2: #a3a3ab; --border: #3a3a40;
			--accent: #4cc3c0; --accent-bg: #123634;
		}
	}

	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100vh;
		background: var(--bg); color: var(--ink);
		font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
	code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

	.badge {
		display: inline-block; padding: 2px 10px; border-radius: 999px;
		border: 1px solid var(--border); background: var(--surface);
		color: var(--ink-2); font-size: 0.85rem;
	}
	h1 { font-size: 2rem; margin: 12px 0 6px; letter-spacing: -0.01em; }
	.lede { color: var(--ink-2); margin: 0 0 32px; }

	.host {
		padding: 20px 22px; border-radius: 12px;
		background: var(--accent-bg); border: 1.5px solid var(--accent);
	}
	.host small { color: var(--ink-2); font-size: 0.85rem; }
	.host code {
		display: block; margin-top: 4px;
		font-size: 1.35rem; font-weight: 600; color: var(--accent);
		overflow-wrap: anywhere;
	}

	h2 { font-size: 1rem; margin: 32px 0 10px; }
	ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
	li {
		display: flex; justify-content: space-between; gap: 12px;
		padding: 10px 14px; border-radius: 8px;
		background: var(--surface); border: 1px solid var(--border);
	}
	li span { color: var(--ink-2); }

	footer { margin-top: 40px; color: var(--ink-2); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
	<span class="badge">App 3 · app par défaut</span>
	<h1>Hôte inconnu</h1>
	<p class="lede">Aucune app n'est configurée pour cet hôte : l'Ingress t'a envoyé sur l'app par défaut.</p>

	<div class="host">
		<small>Hôte demandé</small>
		<code><!--# echo var="host" --></code>
	</div>

	<h2>Règles de l'Ingress</h2>
	<ul>
		<li><code>app1.com</code><span>→ app 1</span></li>
		<li><code>app2.com</code><span>→ app 2</span></li>
		<li><em>tout autre hôte</em><span>→ app 3 (ici)</span></li>
	</ul>

	<footer>Servi par nginx dans le cluster K3s.</footer>
</main>
</body>
</html>
