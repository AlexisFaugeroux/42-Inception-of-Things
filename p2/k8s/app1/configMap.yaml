---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-configmap
data:
  index.html: |
    <html>
      <body>
        <h1>Welcome to App 1!</h1>
      </body>
    </html>

  nginx.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;

      location / {
        try_files $uri $uri/ =404;
      }
    }
